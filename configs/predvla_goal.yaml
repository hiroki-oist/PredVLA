# ★このファイルは論文の学習済み ckpt に保存されていた cfg から機械的に復元した。
#   出所: 元研究リポジトリの goal 学習済み ckpt（seed 1）
#   手で書き写していないので、論文の数値を出したときの設定と 1 バイトも違わない。
#   cache_root だけ PredVLA_reproduce の階層に合わせて ../data → data に直している
#   （元は 1 段下から見ていたため）。
paths:
  cache_root: data/cache_l64
data:
  suite: libero_goal
  tasks: null
  max_demos: 0
  T: 200
  vision_stride: 4
model:
  v_dim: 192
  q_dim: 9
  a_dim: 7
  l_dim: 64
  d: 256
  d_top: 64
  r: 64
  pb_dim: 32
  tau_top: 16
  tau_v: 8
  tau_up: 5
  tau_low: 2
  head_hidden: 256
  gmm_k: 5
  gmm_min_std: 0.05
  w_top: 0.05
  w_v: 0.02
  w_up: 0.02
  w_low: 0.01
train:
  run_name: predvla_goal
  seed: 1
  total_steps: 30000
  batch_size: 32
  lr: 6.0e-05
  lr_c: 0.01
  weight_decay: 0.0001
  lr_schedule: none
  lambda_a: 1.0
  clip_w: 10.0
  clip_c: 100.0
  ckpt_every: 5000
  log_every: 100
  prior_every: 1000
  compile: true
